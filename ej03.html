<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="ej03.css">
    <title> La Galería de Imágenes Asimétrica</title>
</head>
    <body>
        <section class="galeria">
            <h1>Cuadros Van Gogh</h1>
       
            <figure class="El_dormitorio_en_Arlés">
                <img src="https://tse3.mm.bing.net/th/id/OIP.jCneV7Fy9-2Nlb-OfHQEHAHaF0?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="El dormitorio en Arlés">
                <figcaption>El dormitorio en Arlés</figcaption>
            </figure>

            <figure class="Campo_de_trigo_con_cuervos">
                <img src="https://tse1.mm.bing.net/th/id/OIP.A2khnlOdC4bBPfa_rPAWRAHaDp?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Campo de trigo con cuervos">
                <figcaption>Campo de trigo con cuervos</figcaption>
            </figure>

            <figure class="Autorretrato_con_la_oreja_vendada">
                <img src="https://www.slobidka.com/images/vangogh/Van_Gogh-28.jpg" alt="Autorretrato con la oreja vendada">
                <figcaption>Autorretrato con la oreja vendada</figcaption>
            </figure>
            
            <figure class="la_noche_estrellada">
                <img src="https://th.bing.com/th/id/R.cb16fbe694f1b6ed15bc12d7e69bf143?rik=T2GteMxZ8G9%2bjQ&riu=http%3a%2f%2fwww.scienceleadership.org%2fthumbnail%2f23438%2f1920x1920&ehk=vYLI2tpN5rpMuJPzQumN0ENajoJTvEIu1UisciSElkQ%3d&risl=&pid=ImgRaw&r=0" alt="La noche estrellada">
                <figcaption>La noche estrellada</figcaption>
            </figure>

            <figure class="girasoles">
                <img src="https://tse3.mm.bing.net/th/id/OIP.EumMZdEhmt8YQyoZ5Eyp1gHaJJ?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Girasoles" >
                <figcaption>Girasoles</figcaption>
            </figure>

            <figure class="Almendro_en_flor">
                <img src="https://tse2.mm.bing.net/th/id/OIP.wxRViiD6MrvgDswPQxQ5QAHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Almendro en flor van gogh">
                <figcaption>Almendro en flor</figcaption>
            </figure>

            <figure class="Irises">
                <img src="https://hips.hearstapps.com/hmg-prod/images/iris-1646764195.jpg?crop=1xw:1xh;center" alt="Irises">
                <figcaption>Irises</figcaption>
            </figure>
        </section>
    </body>
</html>
